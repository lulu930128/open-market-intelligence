name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install backend dependencies
        run: python -m pip install -r backend\requirements.txt

      - name: Check backend dependency compatibility
        run: python -m pip check

      - name: Compile backend
        run: python -m compileall backend\app

      - name: Run backend unit tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -p no:cacheprovider backend\tests

  frontend:
    name: Frontend
    runs-on: windows-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm exec tsc -- --noEmit --incremental false --pretty false

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npm exec playwright install chromium

      - name: Run frontend smoke tests
        run: npm run test:e2e
