name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-metadata:
    name: Release metadata
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify release version
        shell: powershell
        run: .\scripts\check-release-version.ps1

  architecture:
    name: Architecture guard (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install architecture test dependencies
        run: python -m pip install pydantic==2.13.4 pytest==9.1.0

      - name: Run architecture checker
        run: python scripts\check-architecture.py

      - name: Run architecture tests
        env:
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider backend\tests\architecture

  backend:
    name: Backend (Python ${{ matrix.python-version }}, shard ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r backend\requirements.txt

      - name: Check backend dependency compatibility
        run: .\.venv\Scripts\python.exe -m pip check

      - name: Compile backend
        run: .\.venv\Scripts\python.exe -m compileall backend\app

      - name: Run backend unit tests
        env:
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: "1"
        run: .\.venv\Scripts\python.exe scripts\ci-backend-shards.py --shard ${{ matrix.shard }} --shards 8

      - name: Upload backend collection and test receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ matrix.python-version }}-shard-${{ matrix.shard }}
          path: ci-results/
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: windows-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm exec tsc -- --noEmit --incremental false --pretty false

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npm exec playwright install chromium

      - name: Run frontend smoke tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
