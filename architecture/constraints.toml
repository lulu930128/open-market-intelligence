schema_version = 1

[[rules]]
id = "us_eod_distribution_read_boundary"
kind = "python_forbidden_import"
description = "US EOD snapshot builder composes batched canonical reads; GET reads its existing checkpoint; no provider, scheduler or consumer ownership."
roots = ["backend/app/us_market/sector_distribution.py", "backend/app/us_market/classification.py"]
extensions = [".py"]
forbidden_prefixes = ["app.us_market.providers", "app.us_market.classification_sync", "app.jobs", "app.ai", "app.routers", "requests", "httpx"]

[[rules]]
id = "us_sic_command_existing_owners"
kind = "python_forbidden_import"
description = "SEC SIC command delegates acquisition and persistence; no HTTP client, job framework or consumer ownership."
roots = ["backend/app/us_market/classification_sync.py"]
extensions = [".py"]
forbidden_prefixes = ["requests", "httpx", "urllib", "sqlite3", "app.jobs", "app.ai", "app.routers"]

[[rules]]
id = "us_eod_distribution_no_write"
kind = "python_forbidden_call"
description = "US EOD projection and checkpoint reads cannot acquire or persist; the existing EOD job owns materialization."
roots = ["backend/app/us_market/sector_distribution.py", "backend/app/us_market/classification.py"]
extensions = [".py"]
forbidden_call_names = ["commit", "flush", "rollback", "refresh", "enqueue", "create_all", "execute", "persist"]

[[rules]]
id = "job_cooperative_protocol_has_no_runtime_owner"
kind = "python_forbidden_import"
description = "Job stop/checkpoint protocol and continuation codec cannot own executors, DB IO, providers or runtime control."
roots = ["backend/app/jobs/cooperative.py", "backend/app/jobs/resumption.py"]
extensions = [".py"]
forbidden_prefixes = ["concurrent.futures", "sqlalchemy", "sqlite3", "subprocess", "requests", "httpx", "app.db", "app.market", "app.crypto_market", "app.runtime", "app.routers"]

[[rules]]
id = "job_service_no_forced_cancellation"
kind = "python_forbidden_call"
description = "JobService must retain actual Future completion; no thread/process kill or Future cancellation can substitute for a durable pause."
roots = ["backend/app/jobs/service.py", "backend/app/jobs/cooperative.py", "backend/app/jobs/resumption.py"]
extensions = [".py"]
forbidden_call_names = ["kill", "terminate", "cancel", "PyThreadState_SetAsyncExc"]

[[rules]]
id = "owned_shutdown_transport_no_data_or_process_owner"
kind = "python_forbidden_import"
description = "Owned Uvicorn transport delegates lifespan; it cannot own data IO, provider operations or process management."
roots = ["backend/app/owned_uvicorn.py"]
extensions = [".py"]
forbidden_prefixes = ["subprocess", "sqlite3", "sqlalchemy", "app.db", "app.market", "app.jobs", "app.runtime"]

[[rules]]
id = "runtime_control_transport_no_business_or_process_owner"
kind = "python_forbidden_import"
description = "Runtime HTTP/pipe transport has no DB, market, AI, shell or lifecycle ownership."
roots = ["backend/app/runtime_control.py", "backend/app/routers/runtime_control.py"]
extensions = [".py"]
forbidden_prefixes = ["app.db", "app.jobs", "app.ai", "app.market", "app.market_data", "app.runtime", "sqlalchemy", "subprocess", "requests", "httpx"]

[[rules]]
id = "runtime_control_transport_no_mutation"
kind = "python_forbidden_call"
description = "Runtime transport cannot kill/spawn processes, signal events or write DB/receipt storage."
roots = ["backend/app/runtime_control.py", "backend/app/routers/runtime_control.py"]
extensions = [".py"]
forbidden_call_names = ["kill", "terminate", "Popen", "system", "commit", "flush", "write_text", "write_bytes", "unlink"]

[[rules]]
id = "tw_intraday_radar_read_boundary"
kind = "python_forbidden_import"
description = "Intraday discovery uses cached lightweight state; candidate admission cannot acquire or depend on consumers."
roots = ["backend/app/market/tw_intraday_discovery.py", "backend/app/market/tw_intraday_radar.py", "backend/app/market/tw_intraday_radar_contracts.py"]
extensions = [".py"]
forbidden_prefixes = ["app.market.providers", "app.jobs", "app.dispatch", "app.ai", "app.routers", "app.sources", "app.pipelines", "app.market.tw_intraday_universe", "app.market.tw_intraday_platform", "app.market.tw_realtime_lease_platform", "requests", "httpx"]

[[rules]]
id = "tw_intraday_radar_read_transaction"
kind = "python_forbidden_call"
description = "Intraday discovery and candidate evaluation never persist or admit acquisition."
roots = ["backend/app/market/tw_intraday_discovery.py", "backend/app/market/tw_intraday_radar.py", "backend/app/market/tw_intraday_radar_contracts.py"]
extensions = [".py"]
forbidden_call_names = ["commit", "rollback", "flush", "persist_taiwan_intraday_stock_states", "resolve_taiwan_tier_a_target_plan"]

[[rules]]
id = "tw_intraday_candidate_engine_pure"
kind = "python_forbidden_import"
description = "Versioned Intraday candidate contract and gate are pure and do not reuse Radar v2 scoring."
roots = ["backend/app/market/tw_intraday_radar.py", "backend/app/market/tw_intraday_radar_contracts.py"]
extensions = [".py"]
forbidden_prefixes = ["app.db", "sqlalchemy", "app.radar", "app.market.tw_intraday_state", "app.market.tw_intraday_discovery"]

[[rules]]
id = "tw_workspace_read_boundary"
kind = "python_forbidden_import"
description = "Progressive workspace composes canonical cache reads, never acquisition or job owners."
roots = ["backend/app/market/tw_workspace.py", "backend/app/market/tw_watchlist_state.py"]
extensions = [".py"]
forbidden_prefixes = ["app.market.providers", "app.jobs", "app.dispatch", "app.sources", "app.pipelines", "requests", "httpx"]

[[rules]]
id = "tw_workspace_read_transaction"
kind = "python_forbidden_call"
description = "Workspace and canonical batch readers never own persistence transactions."
roots = ["backend/app/market/tw_workspace.py", "backend/app/market/tw_watchlist_state.py", "backend/app/market/public_quote_repository.py", "backend/app/market/daily_price_repository.py"]
extensions = [".py"]
forbidden_call_names = ["commit", "rollback", "flush"]

[[rules]]
id = "tw_daily_day_state_pure"
kind = "python_forbidden_import"
description = "Instrument-day classification is pure and cannot acquire, persist or depend on consumers."
roots = ["backend/app/market/tw_daily_day_state.py"]
extensions = [".py"]
forbidden_prefixes = ["app.db", "sqlalchemy", "app.market.providers", "app.jobs", "app.dispatch", "requests", "httpx"]

[[rules]]
id = "discord_history_orchestration_only"
kind = "python_forbidden_import"
description = "Discord history preparation delegates market repair to common technical readiness."
roots = ["backend/app/jobs/market_report_history.py"]
extensions = [".py"]
forbidden_prefixes = ["app.market", "app.market_data", "app.db", "app.sources", "app.pipelines"]

[[rules]]
id = "tw_technical_canonical_inputs_only"
kind = "python_forbidden_import"
description = "Technical consumes canonical bars and day-state; providers and event persistence remain at market owners."
roots = ["backend/app/market/tw_technical_service.py"]
extensions = [".py"]
forbidden_prefixes = ["app.market.providers", "app.market.tw_corporate_events", "app.db", "app.jobs"]

[[rules]]
id = "discord_report_read_boundary"
kind = "python_forbidden_import"
description = "Discord selection/enrichment stays cache-only; history preparation belongs to the explicit jobs write phase."
roots = ["backend/app/dispatch/discord_market_report.py", "backend/app/dispatch/market_report_presentation.py"]
extensions = [".py"]
forbidden_prefixes = ["app.jobs", "app.market.backfill", "app.market.providers", "app.sources", "app.pipelines"]

[[rules]]
id = "tw_materialization_single_command_owner"
kind = "python_forbidden_import_names"
description = "Taiwan fetch/repair entry points must use the canonical materialization JobRun, not acquisition primitives. Streaming ingestion keeps its own lifecycle."
roots = ["backend/app/routers", "backend/app/ai", "backend/app/jobs/taiwan_intraday_bar_scheduler.py", "backend/app/jobs/taiwan_bar_bootstrap.py", "backend/app/jobs/taiwan_intraday_repair.py"]
extensions = [".py"]
modules = ["app.market.tw_intraday_platform"]
forbidden_names = ["refresh_taiwan_intraday_bars", "bootstrap_taiwan_intraday_bars"]

[[rules]]
id = "shared_market_data_reverse_dependency"
kind = "python_forbidden_import"
description = "Shared Market Data Foundation cannot depend on market-specific service namespaces."
roots = ["backend/app/market_data"]
extensions = [".py"]
forbidden_prefixes = [
  "app.market",
  "app.us_market",
  "app.jp_market",
  "app.kr_market",
  "app.crypto_market",
]

[[rules]]
id = "shared_market_data_database_dependency"
kind = "python_forbidden_import"
description = "Shared Market Data Foundation cannot own SQLAlchemy models or database sessions."
roots = ["backend/app/market_data"]
extensions = [".py"]
forbidden_prefixes = ["app.db", "sqlalchemy"]

[[rules]]
id = "shared_market_data_integration_dependency"
kind = "python_forbidden_import"
description = "Shared Market Data Foundation cannot import provider acquisition or ingestion implementations."
roots = ["backend/app/market_data"]
extensions = [".py"]
forbidden_prefixes = ["app.sources", "app.pipelines"]

[[rules]]
id = "shared_market_data_transaction"
kind = "python_forbidden_call"
description = "Shared Market Data Foundation cannot commit, rollback, or flush database transactions."
roots = ["backend/app/market_data"]
extensions = [".py"]
forbidden_call_names = ["commit", "rollback", "flush"]

[[rules]]
id = "router_transaction"
kind = "python_forbidden_call"
description = "FastAPI routers are transport boundaries and cannot own database transactions."
roots = ["backend/app/routers"]
extensions = [".py"]
forbidden_call_names = ["commit", "rollback", "flush"]

[[rules]]
id = "get_side_effect"
kind = "fastapi_get_side_effect"
description = "GET handlers cannot directly trigger acquisition, refresh, repair, jobs, persistence, or dynamic side-effect flags."
roots = ["backend/app/routers"]
extensions = [".py"]
side_effect_call_prefixes = [
  "acquire_",
  "backfill_",
  "create_",
  "delete_",
  "dispatch_",
  "enqueue_",
  "ensure_",
  "persist_",
  "reconcile_",
  "refresh_",
  "reload_",
  "repair_",
  "send_",
  "start_",
  "stop_",
  "subscribe_",
  "sync_",
  "update_",
  "write_",
]
side_effect_keywords = [
  "ensure_daily",
  "ensure_history",
  "ensure_latest",
  "force",
  "refresh",
  "reload_all",
  "repair",
  "subscribe",
]

[[rules]]
id = "ai_market_provider_dependency"
kind = "python_forbidden_import"
description = "AI decision code cannot import market provider implementations directly."
roots = ["backend/app/ai"]
extensions = [".py"]
forbidden_prefixes = [
  "app.market.providers",
  "app.us_market.providers",
  "app.jp_market.providers",
  "app.kr_market.providers",
  "app.crypto_market.providers",
]

[[rules]]
id = "external_adapter_backend_dependency"
kind = "python_forbidden_import"
description = "MCP and external adapters cannot import OMI database or market provider implementations."
roots = ["agents"]
extensions = [".py"]
forbidden_prefixes = [
  "app.db",
  "sqlalchemy",
  "app.sources",
  "app.pipelines",
  "app.market.providers",
  "app.us_market.providers",
  "app.jp_market.providers",
  "app.kr_market.providers",
  "app.crypto_market.providers",
]

[[rules]]
id = "frontend_provider_selection"
kind = "frontend_provider_selection"
description = "Frontend production requests cannot select a market-data provider."
roots = ["frontend/src"]
extensions = [".ts", ".tsx"]
request_call_prefixes = ["request", "fetch"]
production_path_prefixes = ["/api/"]
diagnostic_path_fragments = ["/diagnostics/"]

[[rules]]
id = "legacy_root_architecture_review"
kind = "forbidden_path"
description = "Historical architecture review must not return to the repository root."
paths = ["ARCHITECTURE_REVIEW.md"]

[[rules]]
id = "tw_consumer_canonical_storage_access"
kind = "python_forbidden_import_names"
description = "Taiwan outward and research consumers must use canonical daily, quote, and index owners instead of normalized storage rows."
roots = [
  "backend/app/ai",
  "backend/app/market/adr_parity.py",
  "backend/app/market/financial_valuation.py",
  "backend/app/market/next_session_plan.py",
  "backend/app/market/official_breadth_repository.py",
  "backend/app/market/service.py",
  "backend/app/market/stock_volume_pace.py",
  "backend/app/market/technical_evidence.py",
  "backend/app/market/market_chips.py",
  "backend/app/market/tw_derivatives.py",
  "backend/app/market/tw_market_dashboard.py",
  "backend/app/watchlists/radar_outcome_service.py",
  "backend/app/watchlists/radar_outcome_v2_service.py",
  "backend/app/watchlists/radar_automation.py",
  "backend/app/watchlists/radar_backtest_v2.py",
  "backend/app/watchlists/radar_shadow_v2_service.py",
  "backend/app/watchlists/radar_v2_service.py",
]
extensions = [".py"]
modules = ["app.db.models"]
forbidden_names = [
  "MarketDailyPrice",
  "MarketIndexDailyStat",
  "TaiwanStockQuoteSnapshot",
]

[[rules]]
id = "tw_radar_canonical_intraday_access"
kind = "python_forbidden_import_names"
description = "Taiwan radar outcome readers must use canonical Bar projections instead of persisted bar rows or local session aggregation."
roots = ["backend/app/watchlists/radar_outcome_service.py"]
extensions = [".py"]
modules = ["app.db.models"]
forbidden_names = ["MarketIntradayBar"]

[[rules]]
id = "us_consumer_canonical_daily_access"
kind = "python_forbidden_import_names"
description = "US outward, AI, and cross-market consumers must use the canonical US daily platform instead of USDailyPrice rows."
roots = [
  "backend/app/ai",
  "backend/app/market",
  "backend/app/watchlists",
]
extensions = [".py"]
modules = ["app.db.models"]
forbidden_names = ["USDailyPrice"]

[[rules]]
id = "us_outward_canonical_quote_intraday_access"
kind = "python_forbidden_import_names"
description = "US outward consumers must use US Market Truth instead of quote, intraday, or lineage storage rows."
roots = [
  "backend/app/ai",
  "backend/app/routers/us_market.py",
  "backend/app/us_market/market_indices.py",
  "backend/app/us_market/research_service.py",
]
extensions = [".py"]
modules = ["app.db.models"]
forbidden_names = [
  "USQuoteSnapshot",
  "MarketIntradayBar",
  "MarketIntradayBarLineage",
]

[[rules]]
id = "us_market_service_compatibility_facade"
kind = "forbidden_path"
description = "The oversized US service compatibility facade is bounded debt and must be decomposed before it can become a canonical owner."
paths = ["backend/app/us_market/service.py"]
[[rules]]
id = "tw_breadth_receipt_evidence_internal"
kind = "python_forbidden_import"
description = "RawResult batch evidence is provider internal; consumers use canonical breadth diagnostics or discovery coverage."
roots = ["backend/app/ai", "backend/app/routers", "backend/app/market_data", "agents", "backend/app/market/tw_intraday_discovery.py", "backend/app/market/tw_intraday_radar.py", "backend/app/market/tw_intraday_radar_contracts.py"]
extensions = [".py"]
forbidden_prefixes = ["app.market.tw_breadth_acquisition_contract", "app.market.providers.twse_mis_breadth_evidence"]
