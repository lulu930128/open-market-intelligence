schema_version = 1

# Additive owner boundary. Original M1/M2A manifests remain byte-for-byte intact.
[[rules]]
id = "execution_runtime_no_other_plane"
kind = "python_forbidden_import"
description = "Dedicated execution never imports other applications, transports or external project runtimes."
roots = ["execution_runtime"]
exclude_path_prefixes = ["execution_runtime/tests"]
extensions = [".py"]
forbidden_prefixes = ["app", "backend", "agents", "execution_simulation", "execution_simulation_gateway", "execution_broker_preflight", "execution_kgi_simulator", "execution_manual_mock", "personal_asset_os", "kgi_broker_bridge", "KGI", "fastapi", "uvicorn", "requests", "httpx", "socket", "urllib", "importlib"]

[[rules]]
id = "execution_config_launch_owner"
kind = "python_forbidden_import"
description = "Only the OMI config bootstrap loads dotenv; its single supervisor launches the fixed native interpreter."
roots = ["execution_runtime"]
exclude_path_prefixes = ["execution_runtime/tests", "execution_runtime/launch.py"]
extensions = [".py"]
forbidden_prefixes = ["dotenv", "subprocess"]

[[rules]]
id = "execution_native_import_owner"
kind = "python_forbidden_import"
description = "Only the explicit native factory imports the installed SDK."
roots = ["execution_runtime"]
exclude_path_prefixes = ["execution_runtime/tests", "execution_runtime/native.py"]
extensions = [".py"]
forbidden_prefixes = ["kgisuperpy"]

[[rules]]
id = "execution_native_login_owner"
kind = "python_forbidden_call"
description = "Only the explicit native factory logs in; managed retries remain under the existing Runtime/session owner."
roots = ["execution_runtime"]
exclude_path_prefixes = ["execution_runtime/tests", "execution_runtime/native.py"]
extensions = [".py"]
forbidden_call_names = ["login", "getenv"]

[[rules]]
id = "execution_runtime_no_ordinary_callers"
kind = "python_forbidden_import"
description = "No Backend, MCP, M1, simulation or script imports of the execution engine; the desktop Launcher may invoke only the fixed launch supervisor through its authenticated local component."
roots = ["backend/app", "agents", "scripts", "execution", "execution_simulation", "execution_simulation_gateway", "execution_broker_preflight", "execution_kgi_simulator", "execution_manual_mock"]
exclude_path_prefixes = ["execution/tests", "execution_simulation/tests", "execution_simulation_gateway/tests", "execution_broker_preflight/tests", "execution_kgi_simulator/tests", "execution_manual_mock/tests"]
extensions = [".py"]
forbidden_prefixes = ["execution_runtime"]

[[rules]]
id = "execution_runtime_no_dynamic_native_or_cancel_all"
kind = "python_forbidden_call"
description = "No dynamic SDK loading, credential files, broad cancel or process launch."
roots = ["execution_runtime"]
exclude_path_prefixes = ["execution_runtime/tests"]
extensions = [".py"]
forbidden_call_names = ["__import__", "import_module", "eval", "exec", "load_dotenv", "cancel_order_all", "cancel_all", "system"]

[[rules]]
id = "execution_process_launch_owner"
kind = "python_forbidden_call"
description = "Only the explicit config bootstrap starts the fixed native child."
roots = ["execution_runtime"]
exclude_path_prefixes = ["execution_runtime/tests", "execution_runtime/launch.py"]
extensions = [".py"]
forbidden_call_names = ["Popen"]

[[rules]]
id = "execution_adapter_no_transaction_or_reducer"
kind = "python_forbidden_call"
description = "The KGI session owner maps IO only; application owns transactions and calls the pure reducer."
roots = ["execution_runtime/kgi.py", "execution_runtime/kgi_us.py", "execution_runtime/contracts.py", "execution_runtime/us_contracts.py", "execution_runtime/native.py"]
extensions = [".py"]
forbidden_call_names = ["connect", "commit", "rollback", "reduce_order", "transition"]

[[rules]]
id = "execution_storage_no_business_reduction"
kind = "python_forbidden_call"
description = "Storage supplies schema, lease and codecs; no second reducer or SDK sender."
roots = ["execution_runtime/storage.py"]
extensions = [".py"]
forbidden_call_names = ["reduce_order", "transition", "create_order", "cancel_order"]

[[rules]]
id = "execution_clients_no_engine_or_storage"
kind = "python_forbidden_import"
description = "Normal application/CLI surfaces cannot own broker sessions or persistence."
roots = ["execution_runtime/application.py", "execution_runtime/cli.py", "execution_runtime/headless.py", "execution_runtime/control.py", "execution_runtime/service.py", "execution_runtime/review.py", "execution_runtime/strategy.py"]
extensions = [".py"]
forbidden_prefixes = ["sqlite3", "execution_runtime.storage", "execution_runtime.kgi"]

[[rules]]
id = "execution_clients_no_submit_bypass"
kind = "python_forbidden_call"
description = "Clients delegate to Runtime's durable review/claim, including per-order TW/US Desk confirmations; no raw SDK or engine submit."
roots = ["execution_runtime/application.py", "execution_runtime/cli.py", "execution_runtime/headless.py", "execution_runtime/control.py", "execution_runtime/service.py", "execution_runtime/__main__.py", "execution_runtime/native.py"]
extensions = [".py"]
forbidden_call_names = ["submit", "_submit_engine", "_claim_command", "_dispatch_claimed", "create_order", "connect", "commit", "rollback", "_transaction"]

[[rules]]
id = "execution_review_no_io"
kind = "python_forbidden_call"
description = "Typed review replay has no IO, transaction, clock acquisition or order reduction."
roots = ["execution_runtime/review.py", "execution_runtime/strategy.py"]
extensions = [".py"]
forbidden_call_names = ["open", "read_text", "write_text", "connect", "commit", "rollback", "now", "utcnow", "reduce_order", "create_order", "cancel_order"]

[[rules]]
id = "execution_adapter_no_strategy"
kind = "python_forbidden_import"
description = "Dumb KGI IO/normalizer must not import mutable strategy or review policy."
roots = ["execution_runtime/kgi.py", "execution_runtime/kgi_us.py", "execution_runtime/storage.py", "execution_runtime/contracts.py", "execution_runtime/us_contracts.py", "execution_runtime/native.py"]
extensions = [".py"]
forbidden_prefixes = ["execution_runtime.strategy", "execution_runtime.review"]

[[rules]]
id = "execution_native_no_order_io"
kind = "python_forbidden_call"
description = "The factory only binds a session; KgiSessionOwner owns all broker order IO."
roots = ["execution_runtime/native.py", "execution_runtime/headless.py", "execution_runtime/__main__.py"]
extensions = [".py"]
forbidden_call_names = ["create_order", "cancel_order", "get_trades", "set_event", "OrderReport", "ExecReport"]

[[rules]]
id = "execution_pipe_owner"
kind = "python_forbidden_import"
description = "Only bounded local transport modules use Windows pipes."
roots = ["execution_runtime"]
exclude_path_prefixes = ["execution_runtime/tests", "execution_runtime/service.py", "execution_runtime/control.py"]
extensions = [".py"]
forbidden_prefixes = ["multiprocessing.connection"]

[[rules]]
id = "execution_pipe_no_pickle_or_broker"
kind = "python_forbidden_call"
description = "Local transport uses bounded bytes JSON and cannot issue broker calls or deserialize pickle."
roots = ["execution_runtime/service.py", "execution_runtime/control.py", "execution_runtime/ipc.py"]
extensions = [".py"]
forbidden_call_names = ["recv", "send", "load", "loads", "create_order", "cancel_order", "get_trades", "set_event", "OrderReport", "ExecReport"]

[[rules]]
id = "execution_cash_inventory_sdk_owner"
kind = "python_forbidden_call"
description = "Only the existing KGI session owner queries account cash inventory; no parallel position ledger."
roots = ["execution_runtime"]
exclude_path_prefixes = ["execution_runtime/tests", "execution_runtime/kgi.py"]
extensions = [".py"]
forbidden_call_names = ["InventorySum", "Inventory", "StockPositionReport", "PositionDetailReport", "DeliveryReport"]

[[rules]]
id = "execution_us_mapping_no_io"
kind = "python_forbidden_call"
description = "US values and vendor mapping remain pure; the existing SDK owner performs every effect."
roots = ["execution_runtime/kgi_us.py", "execution_runtime/us_contracts.py"]
extensions = [".py"]
forbidden_call_names = ["open", "read_text", "write_text", "login", "logout", "now", "utcnow", "getenv", "create_order", "cancel_order", "get_trades", "set_event", "OrderReport", "ExecReport", "_transaction", "StockPositionReport", "set_SubAccount"]
